<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubny Emile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>

        /* ─── RESET ─────────────────────────────────────────────── */

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ─── TOKENS ─────────────────────────────────────────────── */

        :root {
            --bg:           #4a4035;
            --panel:        #5a5047;
            --sidebar-bg:   #3d3529;

            --text:         #e8dfd2;
            --muted:        #a89984;

            --accent:       #7a9d6f;
            --attention:    #c45d4a;

            --border:       rgba(200, 93, 74, 0.15);

            --sidebar-w:    96px; /* 1 inch at 96dpi */

            --font-serif:   'EB Garamond', Georgia, serif;
            --font-mono:    'Courier Prime', monospace;

            /* theme-swappable tokens — every page theme below only
               overrides these few variables, instead of repeating
               dozens of selector rules per page. */
            --t-bg-start:    #5a5047;
            --t-bg-end:      #4a4035;
            --t-sidebar-1:   var(--sidebar-bg);
            --t-sidebar-2:   #251f1a;
            --t-sidebar-border: var(--border);
            --t-text:        var(--text);
            --t-muted:       var(--muted);
            --t-accent:      var(--accent);
            --t-accent-soft: rgba(122, 157, 111, 0.7);
            --t-card-bg:     rgba(58, 49, 40, 0.3);
            --t-card-hover-bg: rgba(122, 157, 111, 0.08);
            --t-border:      var(--border);
            --t-font:        var(--font-mono);
        }


        /* ─── BASE ───────────────────────────────────────────────── */

        html, body { height: 100%; }

        body {
            font-family: var(--font-serif);
            background: radial-gradient(circle at 20% 20%, var(--t-bg-start) 0%, var(--t-bg-end) 60%);
            color: var(--t-text);
            line-height: 1.85;
            letter-spacing: 0.2px;
            font-size: 18px;
            transition: background 0.4s ease;
        }

        /* film grain */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
        }


        /* ─── SCROLLBAR ──────────────────────────────────────────── */

        ::-webkit-scrollbar       { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--t-accent); border-radius: 2px; opacity: 0.6; }


        /* ─── LAYOUT ─────────────────────────────────────────────── */

        .container {
            display: flex;
            min-height: 100vh;
        }

        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 100vh;
        }


        /* ─── SIDEBAR ────────────────────────────────────────────── */

        .sidebar {
            width: var(--sidebar-w);
            background: linear-gradient(180deg, var(--t-sidebar-1) 0%, var(--t-sidebar-2) 100%);
            padding: 44px 10px 40px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid var(--t-sidebar-border);
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, border-color 0.4s ease;
            z-index: 9998;
        }

        .sidebar-brand {
            font-family: var(--font-serif);
            font-size: 11px;
            font-style: italic;
            letter-spacing: 0.5px;
            color: var(--t-accent);
            margin-bottom: 48px;
            opacity: 0.9;
            cursor: pointer;
        }

        .sidebar-nav  { flex: 1; }

        .sidebar-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--t-border);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--t-muted);
            opacity: 0.5;
        }


        /* ─── NAV SECTIONS ───────────────────────────────────────── */

        .nav-section { margin-bottom: 6px; }

        .nav-link {
            display: block;
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--t-muted);
            cursor: pointer;
            padding: 9px 0;
            transition: color 0.2s;
            user-select: none;
            text-decoration: none;
        }

        .nav-link:hover { color: var(--t-accent); }

        .nav-section.has-children > .nav-link { cursor: pointer; }

        .nav-items {
            display: none;
            padding: 4px 0 8px 8px;
        }

        .nav-items.show { display: block; }

        .nav-items a {
            display: block;
            text-decoration: none;
            color: var(--t-text);
            font-size: 10px;
            font-family: var(--font-mono);
            padding: 4px 0;
            opacity: 0.65;
            cursor: pointer;
            transition: opacity 0.2s;
            background: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-items a:hover { opacity: 1; }


        /* ─── HERO ───────────────────────────────────────────────── */

        .hero {
            width: 100%;
            background: radial-gradient(circle at center, var(--t-bg-start) 0%, var(--t-bg-end) 100%);
            padding: 60px 64px;
            text-align: center;
            border-bottom: 1px solid var(--t-border);
            position: relative;
            flex-shrink: 0;
        }

        .hero-wrap {
            min-height: calc(100vh - 250px); /* leaves room for footer so a short poem fits on one screen */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-eyebrow {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--t-accent);
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--t-text);
            margin-bottom: 24px;
            line-height: 1.15;
        }

        .hero-tagline {
            font-size: 17px;
            color: var(--t-muted);
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .hero-poem-body {
            max-width: 700px;
            margin: 0 auto 26px;
            font-size: 16px;
            line-height: 1.9;
            white-space: pre-line;
            color: var(--t-muted);
        }

        .hero-poem-link {
            color: var(--t-accent);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .hero-poem-link:hover { opacity: 1; }


        /* ─── CONTENT AREA ───────────────────────────────────────── */

        .content {
            padding: 60px 64px;
            max-width: 760px;
            width: 100%;
        }

        .content-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 44px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--t-border);
        }

        .content-header h2 {
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: var(--t-text);
            font-family: var(--t-font);
        }

        .content-count {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--t-muted);
            letter-spacing: 1px;
        }


        /* ─── ITEM CARDS ─────────────────────────────────────────── */

        .item {
            margin-bottom: 8px;
            height: 72px; /* 0.75 inch at 96dpi */
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            background: var(--t-card-bg);
            position: relative;
            cursor: pointer;
            transition: transform 0.22s ease, background 0.22s ease;
        }

        .item:hover {
            transform: translateX(5px);
            background: var(--t-card-hover-bg);
        }

        .item:hover .item-title,
        .item:hover .item-meta,
        .item:hover .read-more {
            color: var(--t-accent);
            opacity: 1;
        }

        .item:hover .item-preview { color: var(--t-accent-soft); }

        .item-title {
            font-family: var(--t-font);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.2px;
            color: var(--t-text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-family: var(--t-font);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--t-muted);
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .item-preview {
            font-family: var(--t-font);
            font-size: 13px;
            font-weight: 300;
            font-style: italic;
            color: var(--t-muted);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .read-more {
            display: none;
            font-family: var(--t-font);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--t-accent);
            opacity: 0.75;
            cursor: pointer;
        }

        .item:hover .read-more { display: inline; }


        /* ─── EXPANDED DRAWER ────────────────────────────────────── */

        .drawer {
            display: none;
            background: rgba(31, 26, 21, 0.25);
            padding: 28px 32px;
            margin-top: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--t-border);
            position: relative;
        }

        .drawer::before {
            content: '"';
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 48px;
            color: var(--t-accent);
            opacity: 0.15;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .drawer.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .drawer-body {
            font-family: var(--t-font);
            font-size: 17px;
            line-height: 2.1;
            white-space: pre-line;
            color: var(--t-text);
            opacity: 0.9;
        }

        .drawer-close {
            display: inline-block;
            margin-top: 28px;
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--t-muted);
            cursor: pointer;
        }

        .drawer-close:hover { color: var(--t-accent); }


        /* ─── FOOTER ─────────────────────────────────────────────── */

        .footer {
            margin-top: auto;
            width: 100%;
            background: var(--panel);
            padding: 44px 64px;
            text-align: center;
            border-top: 1px solid var(--t-border);
        }

        .footer p {
            font-size: 14px;
            font-style: italic;
            color: var(--t-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .footer-link {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--t-accent);
            color: var(--t-accent);
            padding: 11px 28px;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: background 0.25s, color 0.25s;
        }

        .footer-link:hover {
            background: var(--t-accent);
            color: white;
        }


        /* ─── PAGE VISIBILITY ────────────────────────────────────── */

        .page { display: none; width: 100%; flex-direction: column; align-items: flex-start; }
        .page.active { display: flex; }


        /* ─── ANIMATION ──────────────────────────────────────────── */

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }


        /* ─── RESPONSIVE ─────────────────────────────────────────── */

        @media (max-width: 768px) {
            .hero, .hero-wrap { padding: 40px 28px; min-height: auto; }
            .hero-title     { font-size: 30px; }
            .content        { padding: 36px 24px; }
            .drawer         { padding: 28px 24px; }
            .footer         { padding: 36px 24px; }
        }


        /* ─── PAGE THEMES ────────────────────────────────────────────── 
             Each theme only overrides the small set of --t-* tokens
             declared above. No repeated selector blocks per page. */

        body.theme-poetry {
            --t-bg-start: #6b8c72;
            --t-bg-end:   #4a6653;
            --t-sidebar-1: #3d5c45;
            --t-sidebar-2: #273d2e;
            --t-sidebar-border: rgba(160,200,160,0.15);
            --t-accent: #b8d4b0;
            --t-accent-soft: rgba(208,232,200,0.75);
            --t-card-bg: rgba(160,200,160,0.06);
            --t-card-hover-bg: rgba(160,200,160,0.12);
            --t-border: rgba(160,200,160,0.2);
            --t-font: var(--font-mono);
        }

        body.theme-opinions {
            --t-bg-start: #ffffff;
            --t-bg-end:   #ffffff;
            --t-sidebar-1: #f5f5f5;
            --t-sidebar-2: #e8e8e8;
            --t-sidebar-border: rgba(0,0,0,0.12);
            --t-text: #111111;
            --t-muted: #555555;
            --t-accent: #111111;
            --t-accent-soft: #222222;
            --t-card-bg: #f9f9f9;
            --t-card-hover-bg: #efefef;
            --t-border: rgba(0,0,0,0.1);
            --t-font: Arial, Helvetica, sans-serif;
        }
        body.theme-opinions .item-title  { font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
        body.theme-opinions .item-preview{ font-weight: 400; font-style: italic; font-size: 12px; }
        body.theme-opinions .item-meta   { font-weight: 700; font-size: 9px; }
        body.theme-opinions .content-header h2 { font-weight: 700; }

        body.theme-reviews {
            --t-bg-start: #ffffff;
            --t-bg-end:   #ffffff;
            --t-sidebar-1: #f5f5f5;
            --t-sidebar-2: #e8e8e8;
            --t-sidebar-border: rgba(0,0,0,0.12);
            --t-text: #111111;
            --t-muted: #555555;
            --t-accent: #111111;
            --t-accent-soft: #222222;
            --t-card-bg: #f9f9f9;
            --t-card-hover-bg: #efefef;
            --t-border: rgba(0,0,0,0.1);
            --t-font: 'Baskerville', 'Libre Baskerville', 'Times New Roman', serif;
        }
        body.theme-reviews .item-title   { font-size: 14px; }
        body.theme-reviews .item-preview { font-size: 13px; }
        body.theme-reviews .item-meta    { font-size: 10px; }

        body.theme-recipes {
            --t-bg-start: #2a5f7a;
            --t-bg-end:   #14303f;
            --t-sidebar-1: #14303f;
            --t-sidebar-2: #091820;
            --t-sidebar-border: rgba(42,127,184,0.2);
            --t-accent: #85c4de;
            --t-accent-soft: rgba(133,196,222,0.8);
            --t-card-bg: rgba(42,127,184,0.06);
            --t-card-hover-bg: rgba(42,127,184,0.12);
            --t-border: rgba(42,127,184,0.2);
            --t-font: Georgia, serif;
        }
        body.theme-recipes .content-header h2 { font-family: 'Luckiest Guy', cursive; letter-spacing: 2px; }
        body.theme-recipes .item-title { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; font-size: 13px; }

        /* Letters — home palette, Caveat font, no password styling needed anymore */
        body.theme-letters {
            --t-font: 'Caveat', cursive;
        }
        body.theme-letters .content-header h2 { font-size: 28px; }
        body.theme-letters .item-title  { font-size: 17px; font-weight: 700; }
        body.theme-letters .item-preview{ font-size: 14px; }
        body.theme-letters .item-meta   { font-size: 11px; }
        body.theme-letters .drawer-body { font-size: 20px; line-height: 1.9; }

        body.theme-about {
            --t-bg-start: #5c4830;
            --t-bg-end:   #332817;
            --t-sidebar-1: #332817;
            --t-sidebar-2: #1a140a;
            --t-sidebar-border: rgba(160,110,60,0.2);
            --t-accent: #d4a060;
            --t-accent-soft: rgba(212,160,96,0.8);
            --t-card-bg: rgba(160,110,60,0.06);
            --t-card-hover-bg: rgba(160,110,60,0.12);
            --t-border: rgba(160,110,60,0.2);
            --t-font: var(--font-serif);
        }


        /* ─── FALLING TEXT EFFECT (dark themes only) ───────────────────── */

        body:not(.theme-opinions):not(.theme-reviews) .content .item-title,
        body:not(.theme-opinions):not(.theme-reviews) .content .item-preview,
        body:not(.theme-opinions):not(.theme-reviews) .content .item-meta,
        body:not(.theme-opinions):not(.theme-reviews) .content-header h2,
        body:not(.theme-opinions):not(.theme-reviews) .drawer .drawer-body,
        body:not(.theme-opinions):not(.theme-reviews) .hero-title,
        body:not(.theme-opinions):not(.theme-reviews) .hero-tagline,
        body:not(.theme-opinions):not(.theme-reviews) .hero-eyebrow,
        body:not(.theme-opinions):not(.theme-reviews) .hero-poem-body {
            text-shadow: 0 -2px 0 rgba(0,0,0,0.18), 0 1px 6px rgba(0,0,0,0.10);
        }

        body.theme-opinions .content *,
        body.theme-reviews .content * {
            text-shadow: none !important;
        }

    </style>
</head>
<body>

<!-- ─── LAYOUT ────────────────────────────────────────────────── -->
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand" onclick="goHome()">Rubny Emile</div>

        <nav class="sidebar-nav" id="sidebarNav">
            <!-- populated by buildSidebar() -->
        </nav>

        <div class="sidebar-footer">© 2026</div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- Hero / home (replaced by a featured poem on load) -->
        <header class="hero-wrap" id="heroWrap">
            <div class="hero" id="hero">
                <div class="hero-eyebrow">a personal space</div>
                <h1 class="hero-title">welcome</h1>
                <p class="hero-tagline">everyday i try</p>
            </div>
        </header>

        <!-- Pages injected here -->
        <div id="pages" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>

        <footer class="footer">
            <p>Questions? Thoughts? Want to berate me further?</p>
            <a href="mailto:contact@rubnyemile.com" class="footer-link">Get In Touch</a>
        </footer>

    </main>

</div><!-- /.container -->

<script>

    /* ─────────────────────────────────────────────────────────────
       STATE
    ───────────────────────────────────────────────────────────── */

    let data = {};

    // Theme lookup by page-id root (handles sub-pages like reviews-books)
    const PAGE_THEMES = {
        poetry:   'theme-poetry',
        opinions: 'theme-opinions',
        reviews:  'theme-reviews',
        recipes:  'theme-recipes',
        letters:  'theme-letters',
        about:    'theme-about',
    };

    // Sidebar structure — single source of truth for nav.
    // 'reviews' and 'letters' have children; 'about' and others are direct links.
    const NAV = [
        { id: 'poetry',   label: 'Poetry',   direct: 'poetry' },
        { id: 'opinions', label: 'Opinions', direct: 'opinions' },
        { id: 'reviews',  label: 'Reviews',  children: [
            { id: 'reviews-books', label: 'Books' },
            { id: 'reviews-films', label: 'Films' },
            { id: 'reviews-places', label: 'Places' },
        ]},
        { id: 'recipes',  label: 'Recipes',  direct: 'recipes' },
        { id: 'letters',  label: 'Letters',  direct: 'letters' },
        { id: 'about',    label: 'Who I Am', direct: 'about' },
    ];


    /* ─────────────────────────────────────────────────────────────
       BOOT
    ───────────────────────────────────────────────────────────── */

    document.addEventListener('DOMContentLoaded', async () => {
        await loadContent();
        buildSidebar();
        renderPages();
        showFeaturedPoem();
    });

    async function loadContent() {
        try {
            const res = await fetch('content.json');
            data = await res.json();
        } catch (e) {
            console.error('Could not load content.json', e);
            document.getElementById('pages').innerHTML =
                '<div class="content"><p>Error loading content. Please refresh.</p></div>';
        }
    }


    /* ─────────────────────────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────────────────────────── */

    function buildSidebar() {
        const nav = document.getElementById('sidebarNav');
        nav.innerHTML = NAV.map(section => {
            if (section.direct) {
                return `
                    <div class="nav-section">
                        <a class="nav-link" onclick="showPage('${section.direct}')">${section.label}</a>
                    </div>
                `;
            }
            // section with children — always expanded, no dropdown toggle
            const children = (section.children || []).map(c =>
                `<a onclick="showPage('${c.id}')">${c.label}</a>`
            ).join('');
            return `
                <div class="nav-section has-children">
                    <a class="nav-link" onclick="showPage('${section.children[0].id}')">${section.label}</a>
                    <div class="nav-items show">${children}</div>
                </div>
            `;
        }).join('');
    }


    /* ─────────────────────────────────────────────────────────────
       RENDER PAGES
    ───────────────────────────────────────────────────────────── */

    function renderPages() {
        document.getElementById('pages').innerHTML = [
            renderPoetry(),
            renderOpinions(),
            renderReviewsSub('reviews-books', 'Books'),
            renderReviewsSub('reviews-films', 'Films'),
            renderReviewsSub('reviews-places', 'Places'),
            renderRecipes(),
            renderLetters(),
            renderAbout(),
        ].join('');
    }

    /* Poetry ---------------------------------------------------- */

    function renderPoetry() {
        const poems = data.poetry || [];
        return page('poetry', 'Poetry', `${poems.length} poems`,
            poems.map(poem => `
                ${card({
                    title:   poem.title,
                    meta:    poem.date,
                    preview: poem.preview,
                    action:  `toggleDrawer('poem-${poem.id}')`,
                    label:   'Read Full Poem →',
                })}
                ${drawer(`poem-${poem.id}`, poem.text)}
            `).join('')
        );
    }

    /* Opinions -------------------------------------------------- */

    function renderOpinions() {
        const opinions = (data.opinions || []).filter(op => op.text); // skip empty entries
        return page('opinions', 'Opinions', `${opinions.length} essays`,
            opinions.map(op => `
                ${card({
                    title:   op.title,
                    meta:    op.date,
                    preview: op.preview,
                    action:  `toggleDrawer('opinion-${op.id}')`,
                    label:   'Read More →',
                })}
                ${drawer(`opinion-${op.id}`, op.text)}
            `).join('')
        );
    }

    /* Reviews — Books / Films / Places, each its own page -------- */

    function renderReviewsSub(pageId, label) {
        const key = pageId.replace('reviews-', ''); // books | films | places
        const items = (data.reviews && data.reviews[key]) || [];
        // sort most recent → least recent by date string if present
        const sorted = [...items].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        const body = sorted.length
            ? sorted.map(r => `
                ${card({
                    title:   r.title,
                    meta:    r.date,
                    preview: r.preview,
                    action:  r.text ? `toggleDrawer('${pageId}-${r.id}')` : null,
                    label:   r.text ? 'Read More →' : 'Coming Soon →',
                })}
                ${r.text ? drawer(`${pageId}-${r.id}`, r.text) : ''}
              `).join('')
            : card({ title: 'Coming Soon', meta: '2026', preview: `${label} reviews will be added here.` });

        return page(pageId, label, `${sorted.length} ${label.toLowerCase()}`, body);
    }

    /* Recipes ----------------------------------------------------- */

    function renderRecipes() {
        const recipes = data.recipes || [];
        const sorted = [...recipes].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const body = sorted.length
            ? sorted.map(r => `
                ${card({
                    title:   r.title,
                    meta:    r.date,
                    preview: r.preview,
                    action:  r.text ? `toggleDrawer('recipe-${r.id}')` : null,
                    label:   r.text ? 'Read More →' : 'Coming Soon →',
                })}
                ${r.text ? drawer(`recipe-${r.id}`, r.text) : ''}
              `).join('')
            : card({ title: 'Coming Soon', meta: '2026', preview: 'Recipes will be added here.' });
        return page('recipes', 'Recipes', `${sorted.length} recipes`, body);
    }

    /* Letters — flat list, no password, links straight to content
       or to a "coming soon" drawer if a category has no letters yet ---- */

    function renderLetters() {
        const categories = data.letter_categories || [];
        const body = categories.map(cat => {
            const letters = cat.letters || [];
            if (letters.length === 0) {
                return card({
                    title:   cat.name,
                    meta:    'Coming Soon',
                    preview: 'Letters will appear here.',
                });
            }
            // one card per letter (category name shown in meta)
            return letters.map(letter => `
                ${card({
                    title:   letter.title,
                    meta:    `${cat.name} · ${letter.date}`,
                    preview: letter.preview,
                    action:  `toggleDrawer('letter-${letter.id}')`,
                    label:   'Read Letter →',
                })}
                ${drawer(`letter-${letter.id}`, letter.text)}
            `).join('');
        }).join('');

        const totalLetters = categories.reduce((sum, c) => sum + (c.letters ? c.letters.length : 0), 0);
        return page('letters', 'Letters', `${totalLetters} letters`, body);
    }

    /* About / Who I Am -------------------------------------------- */

    function renderAbout() {
        return page('about', 'Who I Am', '',
            `<p style="margin-bottom:22px; font-size:15px; color:var(--t-text); opacity:0.85; line-height:1.9;">
                I am trying. Most days I fail. Some days I get close. But I keep going.
             </p>
             <p style="margin-bottom:22px; font-size:15px; color:var(--t-muted); line-height:1.9;">
                This space exists for those who are also trying. For scouts and thinkers.
                For anyone brave enough to keep an open mind in a world that resists it.
             </p>
             <p style="font-size:15px; color:var(--t-muted); line-height:1.9;">
                I don't have all the answers. In fact, I have very few. But I'm willing
                to sit in the uncertainty with you and figure it out together.
             </p>`
        );
    }


    /* ─────────────────────────────────────────────────────────────
       HTML PRIMITIVES
    ───────────────────────────────────────────────────────────── */

    function page(id, title, count, body) {
        return `
            <div class="page" id="${id}-page">
                <div class="content">
                    <div class="content-header">
                        <h2>${title}</h2>
                        ${count ? `<span class="content-count">${count}</span>` : ''}
                    </div>
                    ${body}
                </div>
            </div>
        `;
    }

    function card({ title, meta, preview, action, label }) {
        const onclick = action ? `onclick="${action}"` : '';
        const link = action
            ? `<a class="read-more">${label}</a>`
            : label
                ? `<a class="read-more">${label}</a>`
                : '';
        return `
            <div class="item" ${onclick}>
                <div class="item-title">${title}</div>
                ${meta    ? `<div class="item-meta">${meta}</div>`       : ''}
                ${preview ? `<div class="item-preview">${preview}</div>` : ''}
                ${link}
            </div>
        `;
    }

    function drawer(id, text) {
        return `
            <div class="drawer" id="${id}">
                <div class="drawer-body">${text}</div>
                <span class="drawer-close" onclick="event.stopPropagation(); toggleDrawer('${id}')">← Close</span>
            </div>
        `;
    }


    /* ─────────────────────────────────────────────────────────────
       NAVIGATION
    ───────────────────────────────────────────────────────────── */

    function showPage(pageId) {
        document.getElementById('heroWrap').style.display = 'none';
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.drawer').forEach(el => el.classList.remove('active'));

        const target = document.getElementById(pageId + '-page');
        if (target) target.classList.add('active');

        applyTheme(pageId);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyTheme(pageId) {
        const body = document.body;
        Object.values(PAGE_THEMES).forEach(cls => body.classList.remove(cls));
        const root = pageId.split('-')[0]; // 'reviews-books' -> 'reviews'
        const theme = PAGE_THEMES[root];
        if (theme) body.classList.add(theme);
    }

    function goHome() {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.drawer').forEach(el => el.classList.remove('active'));
        document.getElementById('heroWrap').style.display = 'flex';
        document.body.className = ''; // back to default home palette
        showFeaturedPoem();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDrawer(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('active');
        if (el.classList.contains('active')) {
            setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }
    }


    /* ─────────────────────────────────────────────────────────────
       HERO — FEATURED POEM (centered on screen, scrolls only if long)
    ───────────────────────────────────────────────────────────── */

    function showFeaturedPoem() {
        const poems = data.poetry;
        const hero = document.getElementById('hero');
        if (!poems || poems.length === 0) return;

        const poem = poems[Math.floor(Math.random() * poems.length)];

        hero.innerHTML = `
            <div class="hero-eyebrow">featured this moment</div>
            <h1 class="hero-title" style="font-size:30px;">${poem.title}</h1>
            <div class="hero-poem-body">${poem.text}</div>
            <a class="hero-poem-link" onclick="showPage('poetry')">View All Poems →</a>
        `;
    }

</script>
</body>
</html>
